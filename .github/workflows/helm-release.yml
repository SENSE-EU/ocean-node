name: 'Package & publish Helm chart'

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Chart version (vMAJOR.MINOR.PATCH)'
        required: true

env:
  GHCR_CHART_REPO: ghcr.io/${{ github.repository_owner }}/charts

jobs:
  meta:
    name: Determine version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Determine version
        id: ver
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            RAW="${{ github.ref_name }}"
          else
            RAW="${{ github.event.inputs.version }}"
          fi
          if [[ ! "$RAW" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $RAW (expected vMAJOR.MINOR.PATCH, e.g. v1.1.0)"
            exit 1
          fi
          echo "version=${RAW#v}" >> "$GITHUB_OUTPUT"

  package-and-push:
    name: Package chart and push to GHCR (OCI)
    runs-on: ubuntu-latest
    needs: meta
    if: ${{ github.actor != 'dependabot[bot]' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.18.6'

      - name: Lint chart
        run: helm lint charts/ocean-node

      - name: Package chart
        run: |
          set -euo pipefail
          VERSION="${{ needs.meta.outputs.version }}"
          mkdir -p /tmp/chart-out
          helm package charts/ocean-node \
            --version "$VERSION" \
            --app-version "$VERSION" \
            -d /tmp/chart-out

      - name: Upload chart as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ocean-node-helm-chart-${{ needs.meta.outputs.version }}
          path: /tmp/chart-out/*.tgz
          if-no-files-found: error
          retention-days: 90

      - name: Log in to GHCR
        id: ghcr_login
        env:
          GHCR_PUSH_TOKEN: ${{ secrets.GHCR_PUSH_TOKEN }}
        if: env.GHCR_PUSH_TOKEN != ''
        run: |
          echo "${GHCR_PUSH_TOKEN}" | helm registry login ghcr.io \
            --username "${{ github.repository_owner }}" \
            --password-stdin

      - name: Push chart to GHCR (OCI)
        if: steps.ghcr_login.outcome == 'success'
        run: |
          set -euo pipefail
          VERSION="${{ needs.meta.outputs.version }}"
          helm push "/tmp/chart-out/ocean-node-${VERSION}.tgz" "oci://${GHCR_CHART_REPO}"
