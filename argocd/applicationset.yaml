# Fans out one Argo CD Application per target environment/cluster, all pointing
# at the same Helm chart (charts/ocean-node) with per-environment values overlays.
# Not tied to any specific cloud provider: each generator list entry below is just
# a label ("env") plus a destination cluster and a values file. Add, rename, or
# remove entries freely to match whatever clusters you actually have.
#
# Prerequisites:
#   - Argo CD installed somewhere that can reach the target cluster(s).
#   - If Argo CD runs in the SAME cluster you're deploying to (the common case for
#     a single-cluster setup), set server to "https://kubernetes.default.svc".
#   - If Argo CD manages a DIFFERENT/remote cluster, register it first with
#     `argocd cluster add <kubeconfig-context>` and use the server URL it prints.
#
# To add another environment: copy one list entry below, give it a new "env"
# label, point "valuesFile" at a new file under argocd/values/, and set its
# "server"/"namespace". No entry is required to be named after any provider.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: ocean-node
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ['missingkey=error']
  generators:
    - list:
        elements:
          - env: exoscale
            namespace: ocean-node
            server: 'https://kubernetes.default.svc' # in-cluster; change if Argo CD runs elsewhere
            valuesFile: values/exoscale.yaml
            targetRevision: main
  template:
    metadata:
      name: 'ocean-node-{{.env}}'
    spec:
      project: ocean-node
      sources:
        # Source 1: the Helm chart itself.
        - repoURL: https://github.com/SENSE-EU/ocean-node # TODO: replace with the final designated FACIS repository once communicated.
          targetRevision: '{{.targetRevision}}'
          path: charts/ocean-node
          helm:
            valueFiles:
              - '$values/argocd/{{.valuesFile}}'
        # Source 2: same repo, checked out whole (no path) purely so the "$values"
        # reference above can resolve a values file living outside the chart dir.
        - repoURL: https://github.com/SENSE-EU/ocean-node # TODO: keep in sync with source 1.
          targetRevision: '{{.targetRevision}}'
          ref: values
      destination:
        server: '{{.server}}'
        namespace: '{{.namespace}}'
      syncPolicy:
        # Conservative default: keep drift correction (selfHeal) but do NOT prune
        # automatically. Tighten (e.g. manual sync, or add "prune: true") per
        # environment once the team has agreed on a promotion/approval process,
        # especially for production.
        automated:
          selfHeal: true
          prune: false
        syncOptions:
          - CreateNamespace=true
