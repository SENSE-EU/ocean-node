# AppProject scoping what the ocean-node Applications are allowed to do.
# Using a dedicated project (instead of "default") limits blast radius: only this
# repo, these destinations, and these resource kinds can be deployed/touched.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: ocean-node
  namespace: argocd
spec:
  description: Ocean Node (FACIS.FAP_PCI) deployments
  sourceRepos:
    # TODO: replace with the final designated FACIS repository once communicated
    # by the client (see FACIS.FAP_PCI Technical Development Requirements, "Repository rules").
    - https://github.com/SENSE-EU/ocean-node
  destinations:
    # Matches "ocean-node" (single-environment setups) as well as
    # "ocean-node-<env>" (multi-environment setups) namespaces on any cluster.
    - namespace: 'ocean-node*'
      server: '*'
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
  namespaceResourceWhitelist:
    - group: ''
      kind: ConfigMap
    - group: ''
      kind: Secret
    - group: ''
      kind: Service
    - group: ''
      kind: ServiceAccount
    - group: ''
      kind: PersistentVolumeClaim
    - group: apps
      kind: Deployment
    - group: networking.k8s.io
      kind: Ingress
