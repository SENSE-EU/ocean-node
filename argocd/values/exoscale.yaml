# Environment overlay for the "exoscale" cluster entry in applicationset.yaml.
# Merged on top of charts/ocean-node/values.yaml. Secrets are intentionally NOT
# set here — see README.md in this directory.
#
# To add another environment/cluster, copy this file (e.g. values/staging.yaml),
# adjust it, and add one more entry to the generator list in applicationset.yaml.
# Nothing in this chart or the ApplicationSet is tied to any specific cloud
# provider naming — "exoscale" here is just this environment's label.

replicaCount: 1

ingress:
  enabled: true
  className: nginx
  host: node.demo.pontus-x.eu
  tls:
    enabled: true
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-protocols: 'TLSv1.3'

persistence:
  enabled: true
  size: 10Gi
  storageClassName: 'exoscale-sbs'

env:
  NODE_ENV: production
  DB_TYPE: elasticsearch
  DB_URL: 'http://elasticsearch-master.elastic.svc.cluster.local:9200'
  LOG_LEVEL: info
  ELASTICSEARCH_SNIFF_ON_START: 'false'
  ELASTICSEARCH_SNIFF_ON_CONNECTION_FAULT: 'false'
  ELASTICSEARCH_SNIFF_INTERVAL: 'false'
  ASSET_PURGATORY_URL: 'https://raw.githubusercontent.com/deltaDAO/Self-Description-Lifecycle-Management/refs/heads/feat/op-purgatory/op-testnet-asset-purgatory.json'
  FEE_TOKENS: '{"11155420":"0xd35141583f374d401fee1bfddc35910e1d33a588"}'
  FEE_AMOUNT: '{"amount":0,"unit":"MB"}'
  ALLOWED_ADMINS: '["0x28080F654eED6CC00e8b16F4841E92CD0c2C0778"]'
  INDEXER_INTERVAL: '30000'
  POLICY_SERVER_URL: 'https://policy.delta-dao.com'
  NODE_OWNER_INFO: '{"imprint":{"legalName":"deltaDAO AG","email":"contact@delta-dao.com","url":"https://www.delta-dao.com/imprint","address":"Katharinenstraße 30a (Contor) 20457 Hamburg Germany"},"termsAndConditions":{"url":"https://sense.pontus-x.eu/privacy/terms#terms-and-conditions"},"privacyPolicy":{"url":"https://sense.pontus-x.eu/privacy/privacy-policy#privacy-policy"}}'
  # compute.enabled is still false (see below) — this value is inert until someone
  # confirms Exoscale SKS nodes actually run Docker (not containerd-only) and flips it.
  DOCKER_COMPUTE_ENVIRONMENTS: '[{"socketPath": "/var/run/docker.sock","paymentClaimInterval": 120,"environments": [{"id": "deltaDAO","storageExpiry": 604800,"maxJobDuration": 3600,"minJobDuration": 60,"resources": [{ "id": "cpu", "min": 1, "max": 2, "total": 2 },{ "id": "ram", "min": 0, "max": 6, "total": 6 },{ "id": "disk", "min": 0, "max": 20, "total": 20 }],"fees": {"11155420": [{"feeToken": "0xD35141583f374d401fee1BFdDc35910E1D33a588","prices": [{ "id": "cpu", "price": 0.001 },{ "id": "ram", "price": 0.001 },{ "id": "disk", "price": 0.001 }]}]},"free": {"maxJobDuration": 1800,"maxJobs": 3,"resources": [{ "id": "cpu", "max": 1 },{ "id": "ram", "min": 0, "max": 4 },{ "id": "disk", "max": 10 }]}}]}]'

# PRIVATE_KEY, DB_USERNAME, DB_PASSWORD, JWT_SECRET, RPCS, IPFS_GATEWAY: provided via
# existingSecret (see external-secret.yaml), not inlined here. RPCS and IPFS_GATEWAY
# override the chart's ConfigMap defaults of the same name — a Secret key always wins
# over a ConfigMap key of the same name via envFrom precedence.
existingSecret: ocean-node-secrets
