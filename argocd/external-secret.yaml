# Loads ocean-node's secret env vars (PRIVATE_KEY, DB_USERNAME, DB_PASSWORD, JWT_SECRET)
# from an already-running OpenBao instance into a Kubernetes Secret, via External
# Secrets Operator (ESO, https://external-secrets.io).
#
# This assumes the ESO operator (CRDs + controller) is ALREADY installed in the
# cluster. Installing ESO itself is cluster-level infra, not application config, and
# is intentionally out of scope for this repo.
#
# OpenBao is API-compatible with HashiCorp Vault, so ESO's "vault" provider type
# works against it unmodified.
#
# Prerequisites (one-time, done directly against OpenBao/Kubernetes, not via this repo):
#   - OpenBao's Kubernetes auth method enabled and pointed at this cluster, e.g.:
#       bao auth enable kubernetes
#       bao write auth/kubernetes/config kubernetes_host="https://kubernetes.default.svc"
#   - A policy granting read on the secret path used below, and a role bound to the
#     ServiceAccount defined here, e.g.:
#       bao write auth/kubernetes/role/ocean-node-eso \
#         bound_service_account_names=ocean-node-eso \
#         bound_service_account_namespaces=ocean-node \
#         policies=ocean-node-eso \
#         ttl=1h
#   - The four keys (PRIVATE_KEY, DB_USERNAME, DB_PASSWORD, JWT_SECRET) written into
#     OpenBao at the path referenced by `remoteRef.key` below.
#
# Apply this alongside appproject.yaml/applicationset.yaml, before the ocean-node
# Application first syncs, so "ocean-node-secrets" exists in time — this is what
# `existingSecret: ocean-node-secrets` in values/exoscale.yaml points at.
#
# NOTE: apiVersion below targets ESO's v1beta1 CRDs (stable for a long time). If your
# ESO install has moved to v1, bump apiVersion on SecretStore/ExternalSecret to match.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: ocean-node-eso
  namespace: ocean-node
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: openbao
  namespace: ocean-node
spec:
  provider:
    vault:
      server: 'https://openbao.example.com:8200' # TODO: replace with your OpenBao address
      path: secret # TODO: replace with your OpenBao KV mount name, if different
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: ocean-node-eso # must match the OpenBao role bound to the ServiceAccount below
          serviceAccountRef:
            name: ocean-node-eso
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ocean-node-secrets
  namespace: ocean-node
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: ocean-node-secrets # must match existingSecret in values/exoscale.yaml
    creationPolicy: Owner
  data:
    - secretKey: PRIVATE_KEY
      remoteRef:
        key: ocean-node # TODO: path within the KV mount above, e.g. "ocean-node" -> secret/data/ocean-node
        property: PRIVATE_KEY
    - secretKey: DB_USERNAME
      remoteRef:
        key: ocean-node
        property: DB_USERNAME
    - secretKey: DB_PASSWORD
      remoteRef:
        key: ocean-node
        property: DB_PASSWORD
    - secretKey: JWT_SECRET
      remoteRef:
        key: ocean-node
        property: JWT_SECRET
