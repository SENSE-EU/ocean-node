apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ocean-node.fullname" . }}
  labels:
    {{- include "ocean-node.labels" . | nindent 4 }}
spec:
  # Not scaled beyond 1: ocean-node keeps local SQLite / filesystem state per pod.
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "ocean-node.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ocean-node.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "ocean-node.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: ocean-node
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.ports.http }}
              protocol: TCP
            - name: p2p-tcp4
              containerPort: {{ .Values.service.ports.p2pTcp4 }}
              protocol: TCP
            - name: p2p-ws4
              containerPort: {{ .Values.service.ports.p2pWs4 }}
              protocol: TCP
            - name: p2p-tcp6
              containerPort: {{ .Values.service.ports.p2pTcp6 }}
              protocol: TCP
            - name: p2p-ws6
              containerPort: {{ .Values.service.ports.p2pWs6 }}
              protocol: TCP
            - name: p2p-wss4
              containerPort: {{ .Values.service.ports.p2pWss4 }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "ocean-node.fullname" . }}
            - secretRef:
                name: {{ include "ocean-node.secretName" . }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /usr/src/app/logs
              subPath: logs
            - name: data
              mountPath: /usr/src/app/databases
              subPath: databases
            - name: data
              mountPath: /usr/src/app/c2d_storage
              subPath: c2d_storage
            {{- if .Values.compute.enabled }}
            - name: docker-sock
              mountPath: /var/run/docker.sock
            {{- end }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (include "ocean-node.fullname" .) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.compute.enabled }}
        - name: docker-sock
          hostPath:
            path: {{ .Values.compute.dockerSocketPath }}
            type: Socket
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
